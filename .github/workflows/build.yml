name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 mypy
    - name: Lint with flake8
      run: |
        flake8 --max-complexity=22 --max-line-length=127 src
    - name: Check types
      run: |
        mypy --strict src
